<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕷️ Spider Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      background: #1f2937;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #374151;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .system {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin: 10px;
    }

    form {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="chat">

    <header>
      🕷️ Spider Chat
    </header>

    <div id="messages"></div>

    <form id="form">
      <input
        id="input"
        autocomplete="off"
        placeholder="پیامت رو بنویس..."
      >
      <button type="submit">ارسال</button>
    </form>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    function addMessage(text, system = false) {
      const div = document.createElement("div");

      if (system) {
        div.className = "system";
      } else {
        div.className = "message";
      }

      div.textContent = text;
      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;
    }

    socket.on("message", (msg) => {
      addMessage(msg);
    });

    socket.on("system", (msg) => {
      addMessage(msg, true);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      socket.emit("chat message", message);

      input.value = "";
      input.focus();
    });
  </script>

</body>
  </html>
